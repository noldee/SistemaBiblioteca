# ============================================================
# APP
# ============================================================
spring.application.name=biblioteca-universitaria
server.port=${PORT:8080}

# ============================================================
# DATABASE
# ============================================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# ============================================================
# JPA
# ============================================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ============================================================
# FLYWAY
# ============================================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ============================================================
# THYMELEAF
# ============================================================
spring.thymeleaf.cache=false

# ============================================================
# SECURITY
# ============================================================
spring.security.user.name=${ADMIN_USER}
spring.security.user.password=${ADMIN_PASSWORD}

# ============================================================
# GMAIL SMTP
# ============================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=${MAIL_USERNAME}
app.mail.enabled=true

# ============================================================
# OPENLIBRARY
# ============================================================
openlibrary.api.base-url=https://openlibrary.org
openlibrary.api.covers-url=https://covers.openlibrary.org/b

# ============================================================
# PRESTAMOS
# ============================================================
app.prestamo.dias-maximo=14
app.prestamo.limite-por-usuario=3
app.prestamo.dias-aviso=2

# ============================================================
# SWAGGER
# ============================================================
springdoc.swagger-ui.enabled=true

# ============================================================
# CACHE
# ============================================================
spring.cache.type=caffeine

# ============================================================
# LOGS
# ============================================================
logging.level.com.biblioteca=DEBUG
