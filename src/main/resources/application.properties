# ============================================================
# OPEN LIBRARY API
# ============================================================
openlibrary.api.base-url=https://openlibrary.org
openlibrary.api.covers-url=https://covers.openlibrary.org/b

# ============================================================
# CONFIGURACIÓN DE PRÉSTAMOS
# ============================================================
app.prestamo.dias-maximo=14
app.prestamo.limite-por-usuario=3
app.prestamo.dias-aviso=2

# ============================================================
# SWAGGER / OPENAPI
# ============================================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# ============================================================
# CACHE
# ============================================================
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=10m

# ============================================================
# LOGGING
# ============================================================
logging.level.com.biblioteca=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG