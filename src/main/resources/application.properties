# ============================================================
# CONFIGURACIÓN GENERAL
# ============================================================
spring.application.name=biblioteca-universitaria
server.port=8080

# ============================================================
# BASE DE DATOS - PostgreSQL (Supabase)
# ============================================================
spring.datasource.url=jdbc:postgresql://aws-1-us-west-2.pooler.supabase.com:5432/postgres
spring.datasource.username=postgres.jhavskokopovmribfndv
spring.datasource.password=tqK2AvAYOPDSEvh0
spring.datasource.driver-class-name=org.postgresql.Driver

# Pool de conexiones HikariCP
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# ============================================================
# JPA / HIBERNATE
# ============================================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Cache de segundo nivel con Caffeine
