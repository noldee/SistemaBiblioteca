<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<body>

    <!-- ── Navbar usuario ────────────────────────────────────── -->
    <nav th:fragment="navbar" class="bg-white border-b border-gray-100 sticky top-0 z-50 shadow-sm"
        x-data="{ menuOpen: false }">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">

                <!-- Logo -->
                <a href="/catalogo" class="flex items-center gap-2">
                    <div
                        class="w-8 h-8 bg-gradient-to-br from-primary-600 to-primary-800 rounded-lg flex items-center justify-center">
                        <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
                        </svg>
                    </div>
                    <span class="font-display font-bold text-xl text-gray-900">BiblioTech</span>
                </a>

                <!-- Nav links desktop -->
                <div class="hidden md:flex items-center gap-6">
                    <a href="/catalogo"
                        class="text-sm font-medium text-gray-600 hover:text-primary-700 transition-colors"
                        th:classappend="${#httpServletRequest.requestURI.contains('catalogo')} ? 'text-primary-700 font-semibold' : ''">
                        Catálogo
                    </a>
                    <a href="/mis-prestamos"
                        class="text-sm font-medium text-gray-600 hover:text-primary-700 transition-colors"
                        th:classappend="${#httpServletRequest.requestURI.contains('mis-prestamos')} ? 'text-primary-700 font-semibold' : ''">
                        Mis Préstamos
                    </a>
                </div>

                <!-- Acciones -->
                <div class="flex items-center gap-3">
                    <!-- Notificaciones -->
                    <a href="#" class="relative p-2 text-gray-500 hover:text-primary-700 transition-colors">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
                        </svg>
                        <span th:if="${notificacionesCount > 0}" th:text="${notificacionesCount}"
                            class="absolute -top-1 -right-1 bg-red-500 text-white text-xs rounded-full w-4 h-4 flex items-center justify-center"></span>
                    </a>

                    <!-- Usuario dropdown -->
                    <div x-data="{ open: false }" class="relative">
                        <button @click="open = !open"
                            class="flex items-center gap-2 text-sm font-medium text-gray-700 hover:text-primary-700 transition-colors">
                            <div class="w-8 h-8 bg-primary-100 rounded-full flex items-center justify-center">
                                <span class="text-primary-700 font-semibold text-sm" sec:authentication="name"
                                    th:text="${#authentication.name?.substring(0,1)?.toUpperCase()}">U</span>
                            </div>
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M19 9l-7 7-7-7" />
                            </svg>
                        </button>

                        <div x-show="open" @click.away="open = false" x-transition
                            class="absolute right-0 mt-2 w-48 bg-white rounded-xl shadow-lg border border-gray-100 py-1 z-50">
                            <div class="px-4 py-2 border-b border-gray-100">
                                <p class="text-xs text-gray-500">Sesión iniciada como</p>
                                <p class="text-sm font-semibold text-gray-800 truncate" sec:authentication="name">
                                    usuario</p>
                            </div>
                            <a href="/mis-prestamos" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-50">Mis
                                Préstamos</a>
                            <a sec:authorize="hasRole('ADMIN')" href="/admin"
                                class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-50">Panel Admin</a>
                            <form th:action="@{/auth/logout}" method="post" class="border-t border-gray-100">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                <button type="submit"
                                    class="w-full text-left px-4 py-2 text-sm text-red-600 hover:bg-red-50">
                                    Cerrar sesión
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- ── Flash messages ─────────────────────────────────────── -->
    <div th:fragment="flash" class="max-w-7xl mx-auto px-4 pt-4">
        <div th:if="${success}"
            class="flex items-center gap-3 bg-green-50 border border-green-200 text-green-800 rounded-xl px-4 py-3 mb-4"
            x-data x-init="setTimeout(() => $el.remove(), 5000)">
            <svg class="w-5 h-5 text-green-500 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd"
                    d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z"
                    clip-rule="evenodd" />
            </svg>
            <span th:text="${success}" class="text-sm font-medium"></span>
        </div>
        <div th:if="${error}"
            class="flex items-center gap-3 bg-red-50 border border-red-200 text-red-800 rounded-xl px-4 py-3 mb-4"
            x-data x-init="setTimeout(() => $el.remove(), 6000)">
            <svg class="w-5 h-5 text-red-500 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd"
                    d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z"
                    clip-rule="evenodd" />
            </svg>
            <span th:text="${error}" class="text-sm font-medium"></span>
        </div>
    </div>

</body>

</html>
