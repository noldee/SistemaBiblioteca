<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
    th:replace="~{fragments/layout :: html('Gestión de Libros', ~{::main-content})}" lang="es">

<head>
    <title>Libros</title>
</head>

<body>
    <main th:fragment="main-content" class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">

        <!-- Header -->
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-8 anim-fadeinup">
            <div>
                <div class="flex items-center gap-2 text-slate-500 text-sm mb-1">
                    <a th:href="@{/admin}" class="hover:text-slate-300 transition-colors">Admin</a>
                    <i data-lucide="chevron-right" class="w-3.5 h-3.5"></i>
                    <span class="text-slate-300">Libros</span>
                </div>
                <h1 class="font-display text-3xl text-white font-bold">Gestión de Libros</h1>
            </div>
            <a th:href="@{/admin/libros/nuevo}"
                class="flex items-center gap-2 px-5 py-2.5 bg-primary-500 hover:bg-primary-600 text-white rounded-xl font-medium text-sm transition-all shadow-lg shadow-primary-500/20 shrink-0">
                <i data-lucide="plus" class="w-4 h-4"></i> Nuevo libro
            </a>
        </div>

        <!-- Search -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 mb-6 anim-fadeinup anim-delay-1">
            <form th:action="@{/admin/libros}" method="get" class="flex gap-3">
                <div class="relative flex-1">
                    <div class="absolute inset-y-0 left-3.5 flex items-center pointer-events-none">
                        <i data-lucide="search" class="w-4 h-4 text-slate-500"></i>
                    </div>
                    <input type="text" name="q" th:value="${q}" placeholder="Buscar por título, autor o ISBN..."
                        class="w-full bg-slate-800 border border-slate-700 rounded-xl pl-10 pr-4 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-primary-500 transition-all" />
                </div>
                <button type="submit"
                    class="px-5 py-2.5 bg-primary-500 hover:bg-primary-600 text-white rounded-xl text-sm font-medium transition-colors">
                    Buscar
                </button>
                <a th:if="${q != null}" th:href="@{/admin/libros}"
                    class="px-4 py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-400 rounded-xl text-sm transition-colors">
                    <i data-lucide="x" class="w-4 h-4"></i>
                </a>
            </form>
        </div>

        <!-- Table -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden anim-fadeinup anim-delay-2">
            <div class="overflow-x-auto">
                <table class="w-full">
                    <thead>
                        <tr class="border-b border-slate-800">
                            <th
                                class="text-left text-xs font-semibold text-slate-400 uppercase tracking-wider px-6 py-4">
                                Libro</th>
                            <th
                                class="text-left text-xs font-semibold text-slate-400 uppercase tracking-wider px-6 py-4 hidden md:table-cell">
                                Categoría</th>
                            <th
                                class="text-left text-xs font-semibold text-slate-400 uppercase tracking-wider px-6 py-4">
                                Disponibles</th>
                            <th
                                class="text-left text-xs font-semibold text-slate-400 uppercase tracking-wider px-6 py-4 hidden lg:table-cell">
                                ISBN</th>
                            <th
                                class="text-right text-xs font-semibold text-slate-400 uppercase tracking-wider px-6 py-4">
                                Acciones</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-800">
                        <tr th:if="${#lists.isEmpty(libros)}">
                            <td colspan="5" class="text-center py-16 text-slate-500">
                                <i data-lucide="books" class="w-10 h-10 mx-auto mb-3 opacity-30"></i>
                                <p class="text-sm">No se encontraron libros</p>
                            </td>
                        </tr>
                        <tr th:each="libro : ${libros}" class="hover:bg-slate-800/50 transition-colors group">
                            <td class="px-6 py-4">
                                <div class="flex items-center gap-4">
                                    <img th:src="${libro.coverUrlResolved}" alt="Cover"
                                        class="w-10 h-14 object-cover rounded-lg shadow-md bg-slate-700 shrink-0"
                                        onerror="this.src='/img/no-cover.png'" />
                                    <div class="min-w-0">
                                        <p class="text-sm font-medium text-white truncate max-w-xs"
                                            th:text="${libro.titulo}">Título</p>
                                        <p class="text-xs text-slate-400 mt-0.5" th:text="${libro.autor}">Autor</p>
                                        <span th:if="${!libro.activo}"
                                            class="inline-block mt-1 text-xs bg-red-900/50 text-red-400 px-2 py-0.5 rounded-full">Inactivo</span>
                                    </div>
                                </div>
                            </td>
                            <td class="px-6 py-4 hidden md:table-cell">
                                <span th:if="${libro.categoria}" th:text="${libro.categoria}"
                                    class="text-xs bg-slate-800 text-slate-300 px-2.5 py-1 rounded-full">—</span>
                                <span th:unless="${libro.categoria}" class="text-slate-600 text-sm">—</span>
                            </td>
                            <td class="px-6 py-4">
                                <div class="flex items-center gap-2">
                                    <span class="text-sm font-semibold"
                                        th:text="${libro.ejemplaresDisponibles} + '/' + ${libro.ejemplaresTotal}"
                                        th:classappend="${libro.ejemplaresDisponibles == 0} ? 'text-red-400' : 'text-emerald-400'">0/0</span>
                                    <div class="w-16 h-1.5 bg-slate-700 rounded-full overflow-hidden">
                                        <div class="h-full rounded-full transition-all"
                                            th:classappend="${libro.ejemplaresDisponibles == 0} ? 'bg-red-500' : 'bg-emerald-500'"
                                            th:style="'width:' + ${(libro.ejemplaresDisponibles * 100) / libro.ejemplaresTotal} + '%'">
                                        </div>
                                    </div>
                                </div>
                            </td>
                            <td class="px-6 py-4 hidden lg:table-cell">
                                <span class="text-xs font-mono text-slate-400" th:text="${libro.isbn}">—</span>
                            </td>
                            <td class="px-6 py-4">
                                <div class="flex items-center justify-end gap-2">
                                    <a th:href="@{/admin/libros/{id}/editar(id=${libro.id})}"
                                        class="p-2 text-slate-400 hover:text-primary-400 hover:bg-primary-500/10 rounded-lg transition-all"
                                        title="Editar">
                                        <i data-lucide="pencil" class="w-4 h-4"></i>
                                    </a>
                                    <form th:action="@{/admin/libros/{id}/eliminar(id=${libro.id})}" method="post"
                                        x-data @submit.prevent="if(confirm('¿Eliminar este libro?')) $el.submit()">
                                        <input type="hidden" th:name="${_csrf.parameterName}"
                                            th:value="${_csrf.token}" />
                                        <button type="submit"
                                            class="p-2 text-slate-400 hover:text-red-400 hover:bg-red-500/10 rounded-lg transition-all"
                                            title="Eliminar">
                                            <i data-lucide="trash-2" class="w-4 h-4"></i>
                                        </button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <!-- Footer de tabla -->
            <div th:unless="${#lists.isEmpty(libros)}"
                class="px-6 py-3 border-t border-slate-800 text-xs text-slate-500">
                <span th:text="${#lists.size(libros)}">0</span> libro(s) encontrado(s)
                <span th:if="${q != null}" th:text="'para «' + ${q} + '»'"></span>
            </div>
        </div>
    </main>
</body>

</html>
