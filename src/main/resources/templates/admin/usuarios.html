<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
    th:replace="~{fragments/layout :: html('Gestión de Usuarios', ~{::main-content})}" lang="es">

<head>
    <title>Usuarios</title>
</head>

<body>
    <main th:fragment="main-content" class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">

        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-8 anim-fadeinup">
            <div>
                <div class="flex items-center gap-2 text-slate-500 text-sm mb-1">
                    <a th:href="@{/admin}" class="hover:text-slate-300">Admin</a>
                    <i data-lucide="chevron-right" class="w-3.5 h-3.5"></i>
                    <span class="text-slate-300">Usuarios</span>
                </div>
                <h1 class="font-display text-3xl text-white font-bold">Gestión de Usuarios</h1>
            </div>
        </div>

        <!-- Search -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 mb-6 anim-fadeinup anim-delay-1">
            <form th:action="@{/admin/usuarios}" method="get" class="flex gap-3">
                <div class="relative flex-1">
                    <div class="absolute inset-y-0 left-3.5 flex items-center pointer-events-none">
                        <i data-lucide="search" class="w-4 h-4 text-slate-500"></i>
                    </div>
                    <input type="text" name="q" th:value="${q}" placeholder="Buscar por nombre, email o código..."
                        class="w-full bg-slate-800 border border-slate-700 rounded-xl pl-10 pr-4 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-primary-500 transition-all" />
                </div>
                <button type="submit"
                    class="px-5 py-2.5 bg-primary-500 hover:bg-primary-600 text-white rounded-xl text-sm font-medium transition-colors">Buscar</button>
                <a th:if="${q != null}" th:href="@{/admin/usuarios}"
                    class="px-4 py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-400 rounded-xl text-sm transition-colors flex items-center">
                    <i data-lucide="x" class="w-4 h-4"></i>
                </a>
            </form>
        </div>

        <!-- Table -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden anim-fadeinup anim-delay-2">
            <div class="overflow-x-auto">
                <table class="w-full">
                    <thead>
                        <tr class="border-b border-slate-800">
                            <th
                                class="text-left text-xs font-semibold text-slate-400 uppercase tracking-wider px-6 py-4">
                                Usuario</th>
                            <th
                                class="text-left text-xs font-semibold text-slate-400 uppercase tracking-wider px-6 py-4 hidden md:table-cell">
                                Código / Carrera</th>
                            <th
                                class="text-left text-xs font-semibold text-slate-400 uppercase tracking-wider px-6 py-4 hidden lg:table-cell">
                                Registro</th>
                            <th
                                class="text-left text-xs font-semibold text-slate-400 uppercase tracking-wider px-6 py-4">
                                Rol</th>
                            <th
                                class="text-left text-xs font-semibold text-slate-400 uppercase tracking-wider px-6 py-4">
                                Estado</th>
                            <th
                                class="text-right text-xs font-semibold text-slate-400 uppercase tracking-wider px-6 py-4">
                                Acciones</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-800">
                        <tr th:if="${#lists.isEmpty(usuarios)}">
                            <td colspan="6" class="text-center py-16 text-slate-500">
                                <i data-lucide="users" class="w-10 h-10 mx-auto mb-3 opacity-30"></i>
                                <p class="text-sm">No se encontraron usuarios</p>
                            </td>
                        </tr>
                        <tr th:each="usuario : ${usuarios}" class="hover:bg-slate-800/50 transition-colors">
                            <td class="px-6 py-4">
                                <div class="flex items-center gap-3">
                                    <div class="w-9 h-9 rounded-full bg-primary-500/20 flex items-center justify-center text-sm font-semibold text-primary-400 shrink-0"
                                        th:text="${#strings.substring(usuario.nombre, 0, 1).toUpperCase()}">U</div>
                                    <div>
                                        <p class="text-sm font-medium text-white" th:text="${usuario.nombreCompleto}">
                                            Nombre</p>
                                        <p class="text-xs text-slate-400" th:text="${usuario.email}">email</p>
                                    </div>
                                </div>
                            </td>
                            <td class="px-6 py-4 hidden md:table-cell">
                                <p class="text-xs font-mono text-slate-400" th:text="${usuario.codigoAlumno ?: '—'}">—
                                </p>
                                <p class="text-xs text-slate-500 mt-0.5" th:text="${usuario.carrera ?: '—'}">—</p>
                            </td>
                            <td class="px-6 py-4 hidden lg:table-cell">
                                <span class="text-xs text-slate-400"
                                    th:text="${#temporals.format(usuario.fechaRegistro, 'dd/MM/yyyy')}">—</span>
                            </td>
                            <td class="px-6 py-4">
                                <span class="text-xs px-2.5 py-1 rounded-full font-medium"
                                    th:classappend="${usuario.rol.name() == 'ADMIN'} ? 'bg-primary-500/20 text-primary-300' : 'bg-slate-700 text-slate-300'"
                                    th:text="${usuario.rol}">ROL</span>
                            </td>
                            <td class="px-6 py-4">
                                <span class="text-xs px-2.5 py-1 rounded-full font-medium"
                                    th:classappend="${usuario.activo} ? 'bg-emerald-900/50 text-emerald-400' : 'bg-red-900/50 text-red-400'"
                                    th:text="${usuario.activo} ? 'Activo' : 'Inactivo'">Activo</span>
                            </td>
                            <td class="px-6 py-4">
                                <div class="flex items-center justify-end">
                                    <form th:action="@{/admin/usuarios/{id}/toggle(id=${usuario.id})}" method="post"
                                        x-data
                                        @submit.prevent="if(confirm('¿Cambiar estado del usuario?')) $el.submit()">
                                        <input type="hidden" th:name="${_csrf.parameterName}"
                                            th:value="${_csrf.token}" />
                                        <button type="submit" class="p-2 rounded-lg transition-all text-sm font-medium"
                                            th:classappend="${usuario.activo} ? 'text-slate-400 hover:text-red-400 hover:bg-red-500/10' : 'text-slate-400 hover:text-emerald-400 hover:bg-emerald-500/10'"
                                            th:title="${usuario.activo} ? 'Desactivar' : 'Activar'">
                                            <i data-lucide="toggle-left" class="w-5 h-5" th:if="${!usuario.activo}"></i>
                                            <i data-lucide="toggle-right" class="w-5 h-5" th:if="${usuario.activo}"></i>
                                        </button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div th:unless="${#lists.isEmpty(usuarios)}"
                class="px-6 py-3 border-t border-slate-800 text-xs text-slate-500">
                <span th:text="${#lists.size(usuarios)}">0</span> usuario(s) registrado(s)
            </div>
        </div>
    </main>
</body>

</html>
