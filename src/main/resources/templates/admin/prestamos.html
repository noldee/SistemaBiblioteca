<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
    th:replace="~{fragments/layout :: html('Gestión de Préstamos', ~{::main-content})}" lang="es">

<head>
    <title>Préstamos</title>
</head>

<body>
    <main th:fragment="main-content" class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">

        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-8 anim-fadeinup">
            <div>
                <div class="flex items-center gap-2 text-slate-500 text-sm mb-1">
                    <a th:href="@{/admin}" class="hover:text-slate-300 transition-colors">Admin</a>
                    <i data-lucide="chevron-right" class="w-3.5 h-3.5"></i>
                    <span class="text-slate-300">Préstamos</span>
                </div>
                <h1 class="font-display text-3xl text-white font-bold tracking-tight">Gestión de Préstamos</h1>
            </div>

            <form th:action="@{/admin/prestamos/procesar-vencimientos}" method="post" class="shrink-0">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <button type="submit"
                    class="flex items-center gap-2 px-4 py-2.5 bg-red-950/40 hover:bg-red-900 text-red-400 border border-red-900/60 rounded-xl text-sm font-medium transition-all shadow-sm active:scale-98">
                    <i data-lucide="clock-alert" class="w-4 h-4"></i> Procesar vencimientos
                </button>
            </form>
        </div>

        <div th:if="${success}"
            class="mb-6 flex items-center gap-3 bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 px-4 py-3.5 rounded-xl anim-fadeinup shadow-lg">
            <i data-lucide="check-circle" class="w-5 h-5 shrink-0 text-emerald-400"></i>
            <span class="text-sm font-medium" th:text="${success}"></span>
        </div>
        <div th:if="${error}"
            class="mb-6 flex items-center gap-3 bg-red-500/10 border border-red-500/30 text-red-400 px-4 py-3.5 rounded-xl anim-fadeinup shadow-lg">
            <i data-lucide="alert-circle" class="w-5 h-5 shrink-0 text-red-400"></i>
            <span class="text-sm font-medium" th:text="${error}"></span>
        </div>

        <div class="flex items-center gap-2 mb-6 flex-wrap anim-fadeinup anim-delay-1">
            <a th:href="@{/admin/prestamos}" class="px-4 py-2 rounded-xl text-sm font-medium transition-all border"
                th:classappend="${estadoFiltro == null} ? 'bg-primary-500 text-white border-primary-600 shadow-sm shadow-primary-500/20' : 'bg-slate-900 text-slate-400 border-slate-800/80 hover:bg-slate-800 hover:text-slate-200'">
                Todos
            </a>
            <a th:each="est : ${estados}" th:href="@{/admin/prestamos(estado=${est})}" th:text="${est}"
                class="px-4 py-2 rounded-xl text-sm font-medium transition-all border"
                th:classappend="${estadoFiltro == est.name()} ? 'bg-primary-500 text-white border-primary-600 shadow-sm shadow-primary-500/20' :
                              (${est.name() == 'PENDIENTE'} ? 'bg-amber-500/5 text-amber-400 border-amber-500/10 hover:bg-amber-500/10' :
                              (${est.name() == 'VENCIDO'} ? 'bg-red-500/5 text-red-400 border-red-500/10 hover:bg-red-500/10' :
                              'bg-slate-900 text-slate-400 border-slate-800/80 hover:bg-slate-800 hover:text-slate-200'))">
            </a>
        </div>

        <div x-data="prestamoForm()" class="space-y-4">

            <div class="bg-slate-900 border border-slate-800/80 rounded-2xl anim-fadeinup anim-delay-2 shadow-xl">
                <div class="overflow-x-auto rounded-2xl">
                    <table class="w-full min-w-[900px] border-collapse">
                        <thead>
                            <tr class="border-b border-slate-800/80 bg-slate-950/30">
                                <th
                                    class="text-left text-xs font-semibold text-slate-400 uppercase tracking-wider px-6 py-4.5">
                                    Libro</th>
                                <th
                                    class="text-left text-xs font-semibold text-slate-400 uppercase tracking-wider px-6 py-4.5 hidden md:table-cell">
                                    Usuario</th>
                                <th
                                    class="text-left text-xs font-semibold text-slate-400 uppercase tracking-wider px-6 py-4.5">
                                    F. Préstamo</th>
                                <th
                                    class="text-left text-xs font-semibold text-slate-400 uppercase tracking-wider px-6 py-4.5">
                                    F. Devolución</th>
                                <th
                                    class="text-left text-xs font-semibold text-slate-400 uppercase tracking-wider px-6 py-4.5">
                                    Estado</th>
                                <th
                                    class="text-right text-xs font-semibold text-slate-400 uppercase tracking-wider px-6 py-4.5">
                                    Acción</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-800/50">

                            <tr th:if="${#lists.isEmpty(prestamos)}">
                                <td colspan="6" class="text-center py-20 text-slate-500">
                                    <i data-lucide="clipboard-list"
                                        class="w-12 h-12 mx-auto mb-3 opacity-20 text-slate-400"></i>
                                    <p class="text-base font-medium text-slate-400">No se encontraron préstamos</p>
                                    <p class="text-xs text-slate-500 mt-1">Intenta cambiando el filtro de búsqueda</p>
                                </td>
                            </tr>

                            <tr th:each="prestamo : ${prestamos}" class="hover:bg-slate-800/20 transition-colors group"
                                th:classappend="${prestamo.estado.name() == 'VENCIDO'} ? 'border-l-2 border-l-red-500' :
                                               (${prestamo.estado.name() == 'PENDIENTE'} ? 'border-l-2 border-l-amber-500' : '')">

                                <td class="px-6 py-4">
                                    <div class="flex items-center gap-3.5">
                                        <img th:src="${prestamo.libro.coverUrlResolved}" alt="Cover"
                                            class="w-9 h-12 object-cover rounded shadow-md bg-slate-950 shrink-0 border border-slate-800"
                                            onerror="this.src='/img/no-cover.png'" />
                                        <div class="min-w-0">
                                            <p class="text-sm font-semibold text-white truncate max-w-xs group-hover:text-primary-400 transition-colors"
                                                th:text="${prestamo.libro.titulo}">Título</p>
                                            <p class="text-xs text-slate-400 mt-0.5 truncate max-w-xs"
                                                th:text="${prestamo.libro.autor}">Autor</p>
                                        </div>
                                    </div>
                                </td>

                                <td class="px-6 py-4 hidden md:table-cell">
                                    <p class="text-sm font-medium text-slate-200"
                                        th:text="${prestamo.usuario.nombreCompleto}">Usuario</p>
                                    <p class="text-xs text-slate-500 mt-0.5" th:text="${prestamo.usuario.email}">email
                                    </p>
                                    <p th:if="${prestamo.notas != null and #strings.contains(prestamo.notas, 'Email:')}"
                                        class="text-xs text-amber-400/80 mt-1 font-medium bg-amber-500/5 border border-amber-500/10 rounded px-2 py-0.5 inline-block"
                                        th:text="${prestamo.notas}">notas</p>
                                </td>

                                <td class="px-6 py-4">
                                    <span class="text-sm text-slate-300"
                                        th:text="${#temporals.format(prestamo.fechaPrestamo, 'dd/MM/yyyy')}">—</span>
                                </td>

                                <td class="px-6 py-4">
                                    <span class="text-sm font-semibold"
                                        th:classappend="${prestamo.estado.name() == 'VENCIDO'} ? 'text-red-400' : 'text-slate-300'"
                                        th:text="${#temporals.format(prestamo.fechaDevolucion, 'dd/MM/yyyy')}">—</span>
                                    <p th:if="${prestamo.horaDevolucion != null}"
                                        class="text-xs text-slate-500 mt-0.5 font-mono"
                                        th:text="'hrs ' + ${prestamo.horaDevolucion}">hora</p>
                                    <p th:if="${prestamo.estado.name() == 'VENCIDO'}"
                                        class="text-xs text-red-500 font-semibold mt-1 flex items-center gap-1"
                                        th:text="${prestamo.diasMora} + ' días de mora'">mora</p>
                                </td>

                                <td class="px-6 py-4">
                                    <span class="text-xs px-2.5 py-1 rounded-full font-semibold tracking-wide border"
                                        th:classappend="${prestamo.estado.name() == 'ACTIVO'} ? 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20' :
                                                         (${prestamo.estado.name() == 'VENCIDO'} ? 'bg-red-500/10 text-red-400 border-red-500/20' :
                                                         (${prestamo.estado.name() == 'DEVUELTO'} ? 'bg-slate-800/60 text-slate-400 border-slate-700/60' :
                                                         (${prestamo.estado.name() == 'PENDIENTE'} ? 'bg-amber-500/10 text-amber-400 border-amber-500/20' : 'bg-slate-800 text-slate-500')))"
                                        th:text="${prestamo.estado}">Estado</span>
                                </td>

                                <td class="px-6 py-4 text-right">
                                    <div class="flex justify-end" x-data="{ openMenu: false }">
                                        <div class="relative inline-block text-left">

                                            <button @click="openMenu = !openMenu" @click.away="openMenu = false"
                                                class="p-2 text-slate-400 hover:text-white rounded-xl hover:bg-slate-800/80 transition-all focus:outline-none border border-transparent hover:border-slate-700/40">
                                                <i data-lucide="ellipsis-vertical" class="w-4 h-4"></i>
                                            </button>

                                            <div x-show="openMenu" x-transition:enter="transition ease-out duration-100"
                                                x-transition:enter-start="transform opacity-0 scale-95"
                                                x-transition:enter-end="transform opacity-100 scale-100"
                                                x-transition:leave="transition ease-in duration-75"
                                                x-transition:leave-start="transform opacity-100 scale-100"
                                                x-transition:leave-end="transform opacity-0 scale-95"
                                                class="absolute right-0 bottom-full sm:bottom-auto sm:top-full mt-1 mb-1 w-52 bg-slate-950 border border-slate-800 rounded-xl shadow-2xl z-50 overflow-hidden divide-y divide-slate-800/60"
                                                style="display: none;">

                                                <div th:if="${prestamo.estado.name() == 'PENDIENTE'}" class="py-1">
                                                    <form
                                                        th:action="@{/admin/prestamos/{id}/aceptar(id=${prestamo.id})}"
                                                        method="post">
                                                        <input type="hidden" th:name="${_csrf.parameterName}"
                                                            th:value="${_csrf.token}" />
                                                        <button type="submit"
                                                            class="w-full text-left px-4 py-2.5 text-xs font-medium text-emerald-400 hover:bg-slate-900/80 flex items-center gap-2 transition-colors">
                                                            <i data-lucide="check" class="w-4 h-4"></i> Aceptar
                                                            Solicitud
                                                        </button>
                                                    </form>
                                                    <form th:id="'form-rechazar-' + ${prestamo.id}"
                                                        th:action="@{/admin/prestamos/{id}/rechazar(id=${prestamo.id})}"
                                                        method="post">
                                                        <input type="hidden" th:name="${_csrf.parameterName}"
                                                            th:value="${_csrf.token}" />
                                                        <button type="button"
                                                            th:onclick="'confirmarAccion(\'#form-rechazar-\' + ' + ${prestamo.id} + ', \'¿Rechazar solicitud?\', \'Esta solicitud de préstamo cambiará a estado RECHAZADO.\', \'warning\', \'Sí, rechazar\')'"
                                                            class="w-full text-left px-4 py-2.5 text-xs font-medium text-red-400 hover:bg-slate-900/80 flex items-center gap-2 transition-colors">
                                                            <i data-lucide="x" class="w-4 h-4"></i> Rechazar Solicitud
                                                        </button>
                                                    </form>
                                                </div>

                                                <div th:if="${prestamo.estado.name() == 'ACTIVO' or prestamo.estado.name() == 'VENCIDO'}"
                                                    class="py-1">
                                                    <form th:id="'form-devolver-' + ${prestamo.id}"
                                                        th:action="@{/admin/prestamos/{id}/devolver(id=${prestamo.id})}"
                                                        method="post">
                                                        <input type="hidden" th:name="${_csrf.parameterName}"
                                                            th:value="${_csrf.token}" />
                                                        <button type="button"
                                                            th:onclick="'confirmarAccion(\'#form-devolver-\' + ' + ${prestamo.id} + ', \'¿Registrar devolución?\', \'Se registrará el ingreso del libro a la biblioteca.\', \'question\', \'Sí, devolver\')'"
                                                            class="w-full text-left px-4 py-2.5 text-xs font-medium text-emerald-400 hover:bg-slate-900/80 flex items-center gap-2 transition-colors">
                                                            <i data-lucide="corner-down-left" class="w-4 h-4"></i>
                                                            Registrar Devolución
                                                        </button>
                                                    </form>

                                                    <button type="button" th:data-id="${prestamo.id}"
                                                        th:data-fecha="${prestamo.fechaDevolucion}"
                                                        th:data-hora="${prestamo.horaDevolucion}"
                                                        th:data-estado="${prestamo.estado.name()}"
                                                        th:data-notas="${prestamo.notas}" @click="abrirModal($el)"
                                                        class="w-full text-left px-4 py-2.5 text-xs font-medium text-slate-300 hover:bg-slate-900/80 flex items-center gap-2 transition-colors">
                                                        <i data-lucide="pencil" class="w-4 h-4"></i> Editar Fechas /
                                                        Estado
                                                    </button>

                                                    <form
                                                        th:action="@{/admin/prestamos/{id}/notificar(id=${prestamo.id})}"
                                                        method="post">
                                                        <input type="hidden" th:name="${_csrf.parameterName}"
                                                            th:value="${_csrf.token}" />
                                                        <button type="submit"
                                                            class="w-full text-left px-4 py-2.5 text-xs font-medium text-blue-400 hover:bg-slate-900/80 flex items-center gap-2 transition-colors">
                                                            <i data-lucide="bell" class="w-4 h-4"></i> Enviar
                                                            Notificación
                                                        </button>
                                                    </form>
                                                </div>

                                                <div class="py-1 bg-red-950/10">
                                                    <form th:id="'form-eliminar-' + ${prestamo.id}"
                                                        th:action="@{/admin/prestamos/{id}/eliminar(id=${prestamo.id})}"
                                                        method="post">
                                                        <input type="hidden" th:name="${_csrf.parameterName}"
                                                            th:value="${_csrf.token}" />
                                                        <button type="button"
                                                            th:onclick="'confirmarAccion(\'#form-eliminar-\' + ' + ${prestamo.id} + ', \'¿Estás completamente seguro?\', \'Este préstamo se eliminará permanentemente del sistema. No podrás revertir esto.\', \'error\', \'Sí, eliminar definitivamente\')'"
                                                            class="w-full text-left px-4 py-2.5 text-xs text-red-500 hover:bg-red-950/30 font-semibold flex items-center gap-2 transition-colors">
                                                            <i data-lucide="trash-2" class="w-4 h-4"></i> Eliminar
                                                            Registro
                                                        </button>
                                                    </form>
                                                </div>

                                            </div>
                                        </div>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <div th:unless="${#lists.isEmpty(prestamos)}"
                    class="px-6 py-4 border-t border-slate-800/60 text-xs text-slate-500 flex items-center justify-between bg-slate-950/10 rounded-b-2xl">
                    <span>Mostrando <span class="text-slate-400 font-semibold"
                            th:text="${#lists.size(prestamos)}">0</span> préstamo(s) en total</span>
                </div>
            </div>

            <div x-show="isOpen"
                class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/75 backdrop-blur-sm"
                x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0"
                x-transition:enter-end="opacity-100" x-transition:leave="transition ease-in duration-150"
                x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0" style="display: none;">

                <div @click.away="isOpen = false"
                    class="bg-slate-900 border border-slate-800 w-full max-w-md rounded-2xl p-6 shadow-2xl space-y-4 text-white transform transition-all"
                    x-show="isOpen" x-transition:enter="transition ease-out duration-300"
                    x-transition:enter-start="transform scale-95 translate-y-2"
                    x-transition:enter-end="transform scale-100 translate-y-0">

                    <div class="flex justify-between items-center pb-2.5 border-b border-slate-800">
                        <h3 class="text-lg font-bold flex items-center gap-2 tracking-tight">
                            <i data-lucide="pencil" class="w-5 h-5 text-amber-500"></i> Ajustar Préstamo
                        </h3>
                        <button @click="isOpen = false"
                            class="text-slate-400 hover:text-white transition-colors p-1 rounded-lg hover:bg-slate-800">
                            <i data-lucide="x" class="w-5 h-5"></i>
                        </button>
                    </div>

                    <form :action="formAction" method="POST" class="space-y-4">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                        <div>
                            <label
                                class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1.5">Fecha
                                Devolución</label>
                            <input type="date" name="fechaDevolucion" x-model="formData.fecha" required
                                class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500/20 transition-all">
                        </div>

                        <div>
                            <label
                                class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1.5">Hora
                                Devolución</label>
                            <input type="time" name="horaDevolucion" x-model="formData.hora"
                                class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500/20 transition-all">
                        </div>

                        <div>
                            <label
                                class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1.5">Estado</label>
                            <select name="estado" x-model="formData.estado" required
                                class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500/20 transition-all">
                                <option th:each="est : ${estados}" th:value="${est.name()}" th:text="${est}"></option>
                            </select>
                        </div>

                        <div>
                            <label
                                class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1.5">Notas
                                Administrativas</label>
                            <textarea name="notes" x-model="formData.notas" rows="3"
                                class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500/20 transition-all placeholder:text-slate-600"
                                placeholder="Observaciones de control interno..."></textarea>
                        </div>

                        <div class="flex justify-end gap-3 pt-3 border-t border-slate-800/60">
                            <button type="button" @click="isOpen = false"
                                class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl text-sm font-medium transition-colors">Cancelar</button>
                            <button type="submit"
                                class="px-5 py-2 bg-amber-500 hover:bg-amber-600 text-slate-950 rounded-xl text-sm font-bold shadow-md shadow-amber-500/10 transition-colors">Actualizar</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <script>
            // Ventanas de Confirmación Personalizadas con SweetAlert2
            function confirmarAccion(formId, titulo, texto, icono, botonConfirmar) {
                Swal.fire({
                    title: titulo,
                    text: texto,
                    icon: icono,
                    showCancelButton: true,
                    confirmButtonColor: icono === 'error' ? '#ef4444' : '#10b981',
                    cancelButtonColor: '#334155',
                    confirmButtonText: botonConfirmar,
                    cancelButtonText: 'Cancelar',
                    background: '#0f172a',
                    color: '#ffffff',
                    customClass: {
                        popup: 'border border-slate-800 rounded-2xl shadow-2xl'
                    }
                }).then((result) => {
                    if (result.isConfirmed) {
                        const formulario = document.querySelector(formId);
                        if (formulario) {
                            formulario.submit();
                        } else {
                            console.error("No se pudo encontrar el formulario: " + formId);
                        }
                    }
                });
            }

            // Inicialización de Estados y Variables Reactivas (Alpine.js)
            function prestamoForm() {
                return {
                    isOpen: false,
                    formAction: '',
                    formData: { fecha: '', hora: '', estado: '', notas: '' },
                    abrirModal(button) {
                        const id = button.getAttribute('data-id');
                        this.formData.fecha = button.getAttribute('data-fecha') || '';
                        this.formData.hora = button.getAttribute('data-hora') || '';
                        this.formData.estado = button.getAttribute('data-estado') || '';
                        this.formData.notas = button.getAttribute('data-notas') || '';
                        this.formAction = `/admin/prestamos/${id}/editar`;
                        this.isOpen = true;
                    }
                }
            }
        </script>
    </main>
</body>

</html>
