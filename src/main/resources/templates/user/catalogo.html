<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: html('Catálogo', ~{::main-content})}"
    lang="es">

<body>

    <main th:fragment="main-content" class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">

        <!-- HERO -->
        <div class="text-center mb-10">
            <h1 class="text-4xl font-bold text-white mb-4">Biblioteca Digital</h1>
            <p class="text-slate-400 mb-6">Explora miles de libros gratuitos</p>

            <!-- SEARCH -->
            <form th:action="@{/catalogo}" method="get" class="max-w-xl mx-auto flex gap-3">
                <input type="text" name="q" th:value="${q}" placeholder="Buscar libros..."
                    class="flex-1 bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-white" />
                <button type="submit" class="px-6 py-3 bg-primary-500 hover:bg-primary-600 text-white rounded-xl">
                    Buscar
                </button>
            </form>
        </div>

        <!-- ALERTAS -->
        <div th:if="${success}"
            class="mb-6 bg-emerald-500/20 border border-emerald-500 text-emerald-300 px-4 py-3 rounded-xl">
            <span th:text="${success}">Solicitud enviada.</span>
        </div>
        <div th:if="${error}" class="mb-6 bg-red-500/20 border border-red-500 text-red-300 px-4 py-3 rounded-xl">
            <span th:text="${error}">Ocurrió un error.</span>
        </div>

        <!-- GRID -->
        <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-5">

            <div th:each="libro : ${libros}" class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden">

                <!-- IMAGE -->
                <!-- ✅ Open Library: la portada se arma con el primer ISBN o con el key del libro -->
                <div class="aspect-[2/3] bg-slate-800 overflow-hidden relative">
                    <img th:src="${libro.coverId != null}
        ? 'https://covers.openlibrary.org/b/id/' + ${libro.coverId} + '-M.jpg'
        : 'https://via.placeholder.com/130x190?text=Sin+Portada'" th:alt="${libro.title}"
                        class="w-full h-full object-cover"
                        onerror="this.onerror=null; this.src='https://st.depositphotos.com/2934765/53192/v/450/depositphotos_531920820-stock-illustration-photo-available-vector-icon-default.jpg'">
                </div>

                <!-- INFO -->
                <div class="p-4">

                    <h3 class="text-sm font-bold text-white line-clamp-2 mb-2" th:text="${libro.title}"></h3>

                    <!-- ✅ authorName es List<String>, no List<AuthorDto> -->
                    <p class="text-xs text-slate-400 mb-4" th:text="${#lists.isEmpty(libro.authorName)
                            ? 'Autor desconocido'
                            : libro.authorName[0]}">
                    </p>

                    <!-- BOTÓN -->
                    <form th:action="@{/prestamos/formulario}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                        <!-- ✅ key reemplaza al id numérico de Gutendex -->
                        <input type="hidden" name="gutendexId" th:value="${libro.key}" />

                        <input type="hidden" name="titulo" th:value="${libro.title}" />

                        <!-- ✅ authorName[0] en lugar de authors[0].name -->
                        <input type="hidden" name="autor" th:value="${#lists.isEmpty(libro.authorName)
                                ? 'Autor desconocido'
                                : libro.authorName[0]}" />

                        <!-- ✅ URL de portada construida igual que el <img> -->
                        <input type="hidden" name="cover" th:value="${libro.coverId != null}
        ? 'https://covers.openlibrary.org/b/id/' + ${libro.coverId} + '-M.jpg'
        : ''" />
                        <!-- ✅ Open Library no devuelve PDF/HTML directamente; se enlaza la página del libro -->
                        <input type="hidden" name="pdfUrl" th:value="@{'https://openlibrary.org' + ${libro.key}}" />

                        <input type="hidden" name="htmlUrl" th:value="@{'https://openlibrary.org' + ${libro.key}}" />

                        <button type="submit"
                            class="w-full bg-yellow-500 hover:bg-yellow-600 text-black text-xs py-2 rounded-lg font-semibold">
                            Solicitar Libro
                        </button>
                    </form>

                </div>
            </div>
        </div>
        <!-- reemplaza la sección PAGINACIÓN del template -->
        <div class="flex justify-center mt-10">
            <a th:if="${hasNext}" th:href="@{/catalogo(q=${q}, page=${page + 1})}"
                class="px-8 py-3 bg-primary-500 hover:bg-primary-600 text-white rounded-xl font-semibold">
                Cargar más libros ↓
            </a>
        </div>

    </main>

</body>

</html>
