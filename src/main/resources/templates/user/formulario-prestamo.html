<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
    th:replace="~{fragments/layout :: html('Solicitar Libro', ~{::main-content})}">

<body>

    <main th:fragment="main-content" class="max-w-2xl mx-auto px-4 py-10">

        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-8">

            <h1 class="text-2xl font-bold text-white mb-6">
                Solicitar préstamo
            </h1>

            <form th:action="@{/prestamos/solicitar}" method="post" class="space-y-5">

                <!-- CSRF -->

                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                <!-- HIDDEN -->

                <input type="hidden" name="gutendexId" th:value="${form.gutendexId}" />

                <input type="hidden" name="titulo" th:value="${form.titulo}" />

                <input type="hidden" name="autor" th:value="${form.autor}" />

                <input type="hidden" name="cover" th:value="${form.cover}" />

                <input type="hidden" name="pdfUrl" th:value="${form.pdfUrl}" />

                <input type="hidden" name="htmlUrl" th:value="${form.htmlUrl}" />

                <!-- LIBRO -->

                <div class="flex gap-4">

                    <!-- ✅ mostrar la URL en consola del navegador para debuggear -->
                    <img th:src="${form.cover != null and !#strings.isEmpty(form.cover)}
        ? ${form.cover}
        : 'https://via.placeholder.com/130x190?text=Sin+Portada'" th:alt="${form.titulo}" class="w-28 rounded-xl"
                        onerror="this.onerror=null; this.src='https://via.placeholder.com/130x190?text=Sin+Portada'">

                    <div>
                        <h2 class="text-white font-bold text-lg" th:text="${form.titulo}"></h2>
                        <p class="text-slate-400" th:text="${form.autor}"></p>
                        <!-- DEBUG temporal - bórralo después -->
                        <p class="text-xs text-red-400" th:text="${form.cover}"></p>
                    </div>

                </div>

                <!-- EMAIL -->

                <!-- EMAIL -->
                <div>
                    <label class="text-sm text-slate-300">Correo electrónico</label>
                    <input type="email" name="email" required placeholder="tu@correo.com"
                        class="w-full mt-2 bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-white">
                    <p class="text-xs text-slate-500 mt-1">Usaremos este correo para notificarte.</p>
                </div>

                <!-- FECHA -->

                <!-- FECHA Y HORA -->
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="text-sm text-slate-300">Fecha devolución</label>
                        <input type="date" name="fechaDevolucion" required
                            class="w-full mt-2 bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-white">
                    </div>
                    <div>
                        <label class="text-sm text-slate-300">Hora devolución</label>
                        <input type="time" name="horaDevolucion" required
                            class="w-full mt-2 bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-white">
                    </div>
                </div>
                <!-- BOTÓN -->
                <button type="submit"
                    class="w-full bg-primary-500 hover:bg-primary-600 text-white py-3 rounded-xl font-semibold">
                    Enviar solicitud
                </button>

            </form>

        </div>

    </main>
    <script>
        const fechaInput = document.querySelector('input[name="fechaDevolucion"]');
        const hoy = new Date();

        // Mínimo: hoy
        fechaInput.min = hoy.toISOString().split('T')[0];

        // Máximo: 30 días
        const max = new Date(hoy);
        max.setDate(hoy.getDate() + 30);
        fechaInput.max = max.toISOString().split('T')[0];
    </script>

</body>

</html>
